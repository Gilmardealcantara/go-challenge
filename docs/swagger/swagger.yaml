basePath: /
definitions:
  api.ErrorDataResponse:
    properties:
      error:
        type: string
    type: object
  catalog.CategoryResponse:
    properties:
      code:
        type: string
      name:
        type: string
    type: object
  catalog.ProductDetailsResponse:
    properties:
      category:
        $ref: '#/definitions/catalog.CategoryResponse'
      code:
        type: string
      price:
        type: string
      variants:
        items:
          $ref: '#/definitions/catalog.VariantResponse'
        type: array
    type: object
  catalog.ProductResponse:
    properties:
      category:
        $ref: '#/definitions/catalog.CategoryResponse'
      code:
        type: string
      price:
        type: string
    type: object
  catalog.Response:
    properties:
      products:
        items:
          $ref: '#/definitions/catalog.ProductResponse'
        type: array
      total:
        type: integer
    type: object
  catalog.VariantResponse:
    properties:
      name:
        type: string
      price:
        type: string
      sku:
        type: string
    type: object
  categories.CategoryResponse:
    properties:
      code:
        type: string
      name:
        type: string
    type: object
  categories.CreateCategoryRequest:
    properties:
      code:
        example: electronics
        type: string
      name:
        example: Electronics
        type: string
    type: object
host: localhost:8484
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Product catalog management API with categories and variants
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Go Challenge API
  version: "1.0"
paths:
  /catalog:
    get:
      description: Get a paginated list of products with optional filtering by category
        and price
      parameters:
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      - default: 10
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - description: Filter by category code
        in: query
        name: category
        type: string
      - description: Filter by price less than
        in: query
        name: priceLessThan
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorDataResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorDataResponse'
      summary: List products
      tags:
      - catalog
  /catalog/{code}:
    get:
      description: Get detailed information about a specific product including all
        variants
      parameters:
      - description: Product code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.ProductDetailsResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorDataResponse'
      summary: Get product details
      tags:
      - catalog
  /categories:
    get:
      description: Get a list of all available product categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/categories.CategoryResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorDataResponse'
      summary: List categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new product category
      parameters:
      - description: Category data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/categories.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/categories.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorDataResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorDataResponse'
      summary: Create category
      tags:
      - categories
schemes:
- http
swagger: "2.0"
